<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${space.name} + ' 예약 - StudySlot'">예약하기 - StudySlot</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/reservation/reservation.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="reservation-wrap">

    <div class="page-header">
        <p class="eyebrow">Study Slot · Reservation</p>
        <h1 th:text="${space.name}">공간 이름</h1>
        <p class="space-meta">
            <span th:text="${space.roadAddress ?: space.address}">주소</span><br>
            <span class="phone" th:text="${space.phone ?: '전화번호 미등록'}">전화번호</span>
        </p>
    </div>

    <section class="card">
        <div class="card-index">NO. 001</div>

        <div class="section-label">날짜 선택</div>
        <div class="date-tabs">
            <a th:each="d : ${availableDates}"
               th:href="@{/reservation(spaceId=${space.id}, date=${d})}"
               th:class="${d == date} ? 'date-tab active' : 'date-tab'"
               th:text="${#temporals.format(d, 'MM/dd (E)')}">
                08/15 (토)
            </a>
        </div>

        <div class="slot-section">
            <div class="section-label">시간 선택</div>

            <div class="slot-grid" th:if="${!slots.isEmpty()}">
                <button th:each="slot : ${slots}"
                        th:if="${!slot.reserved}"
                        th:text="${slot.startTime} + ' - ' + ${slot.endTime}"
                        th:attr="data-slot-id=${slot.id}"
                        class="slot-btn"
                        type="button">
                    09:00 - 10:00
                </button>
                <button th:each="slot : ${slots}"
                        th:if="${slot.reserved}"
                        disabled
                        class="slot-btn disabled"
                        type="button"
                        th:text="${slot.startTime} + ' - ' + ${slot.endTime} + ' 마감'">
                    10:00 - 11:00 마감
                </button>
            </div>

            <div class="empty-state" th:if="${slots.isEmpty()}">
                해당 날짜에 예약 가능한 시간이 없습니다
            </div>
        </div>
    </section>

</div>

<script th:src="@{/js/reservation/reservation.js}"></script>
</body>
</html>
