<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - StudySlot</title>
    <link rel="stylesheet" th:href="@{/css/user/signup.css}">
</head>
<body>
<div class="signup-box">
    <h1>회원가입</h1>

    <p class="error-msg" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <form id="signup-form" th:action="@{/user/signup}" th:object="${signupRequest}" method="post">
        <div class="field">
            <label for="email">이메일</label>
            <input type="email" id="email" th:field="*{email}" placeholder="you@example.com" autocomplete="off">
            <p class="field-msg" id="email-msg"></p>
        </div>

        <div class="field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}" placeholder="영문+숫자 8~20자" autocomplete="off">
            <ul class="requirement-list" id="password-requirements">
                <li id="req-length" data-req="length">8~20자</li>
                <li id="req-letter" data-req="letter">영문 포함</li>
                <li id="req-number" data-req="number">숫자 포함</li>
            </ul>
        </div>

        <div class="field">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" th:field="*{nickname}" placeholder="한글/영문/숫자 2~10자" autocomplete="off">
            <p class="field-msg" id="nickname-msg"></p>
        </div>

        <button type="submit" id="submit-btn">가입하기</button>
    </form>
</div>

<script th:src="@{/js/user/signup.js}"></script>
</body>
</html>
