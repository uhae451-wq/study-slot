<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>내 정보 - StudySlot</title>
  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/user/mypage.css}">
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const nicknameInput = document.getElementById("nickname");
      const passwordInput = document.getElementById("new-password");
      const passwordConfirmInput = document.getElementById("new-password-confirm");

      const passwordError = document.createElement("p");
      const passwordConfirmError = document.createElement("p");

      passwordError.className = "validation-message";
      passwordConfirmError.className = "validation-message";

      passwordInput.parentElement.appendChild(passwordError);
      passwordConfirmInput.parentElement.appendChild(passwordConfirmError);


      // 비밀번호 유효성 검사
      function validatePassword(password) {
        const passwordRegex = {
          length: /^.{8,20}$/,
          letter: /[a-zA-Z]/,
          number: /[0-9]/
        };

        return (
                passwordRegex.length.test(password) &&
                passwordRegex.letter.test(password) &&
                passwordRegex.number.test(password)
        );
      }


      // 비밀번호 입력 시
      passwordInput.addEventListener("input", () => {
        const password = passwordInput.value;

        if (!password) {
          passwordError.textContent = "";
          return;
        }

        if (!validatePassword(password)) {
          passwordError.textContent =
                  "비밀번호는 영문과 숫자를 포함한 8~20자로 입력해주세요.";
        } else {
          passwordError.textContent = "";
        }

        if (passwordConfirmInput.value) {
          checkPasswordConfirm();
        }
      });


      // 비밀번호 확인 검사
      function checkPasswordConfirm() {
        const password = passwordInput.value;
        const passwordConfirm = passwordConfirmInput.value;

        if (!passwordConfirm) {
          passwordConfirmError.textContent = "";
          return false;
        }

        if (password !== passwordConfirm) {
          passwordConfirmError.textContent = "비밀번호가 일치하지 않습니다.";
          return false;
        }

        passwordConfirmError.textContent = "";
        return true;
      }


      passwordConfirmInput.addEventListener("input", () => {
        checkPasswordConfirm();
      });


      // 회원정보 수정
      document.getElementById("edit-password-btn").addEventListener("click", async () => {

        const nickname = nicknameInput.value.trim();
        const newPassword = passwordInput.value;
        const newPasswordConfirm = passwordConfirmInput.value;
        const messageEl = document.getElementById("edit-message");

        if (!nickname) {
          messageEl.textContent = "닉네임을 입력해주세요.";
          messageEl.style.color = "#A3402F";
          return;
        }

        // 비밀번호를 입력한 경우에만 프론트에서 미리 체크
        if (newPassword || newPasswordConfirm) {
          if (!validatePassword(newPassword)) {
            messageEl.textContent = "비밀번호는 영문과 숫자를 포함한 8~20자로 입력해주세요.";
            messageEl.style.color = "#A3402F";
            return;
          }
          if (!checkPasswordConfirm()) {
            messageEl.textContent = "비밀번호가 일치하지 않습니다.";
            messageEl.style.color = "#A3402F";
            return;
          }
        }

        try {
          const response = await fetch("/user/edit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nickname, newPassword, newPasswordConfirm }),
          });

          const data = await response.json();

          if (!response.ok) {
            messageEl.textContent = data.message;
            messageEl.style.color = "#A3402F";
            return;
          }

          alert(data.message);
          messageEl.textContent = "";
          passwordInput.value = "";
          passwordConfirmInput.value = "";
          // 헤더 닉네임/아바타 즉시 갱신 (서버가 저장한 값 기준)
          document.querySelector(".profile-info h2").textContent = data.nickname;
          document.querySelector(".avatar").textContent = data.nickname.charAt(0);
          // 헤더 닉네임도 갱신 (헤더에 표시되는 경우)
          const headerNickname = document.getElementById("header-nickname");
          if (headerNickname) {
            headerNickname.textContent = data.nickname+"님";
          }
        } catch (err) {
          messageEl.textContent = "요청 중 오류가 발생했습니다.";
          messageEl.style.color = "#A3402F";
        }
      });

    });
  </script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="mypage-wrap">

  <div class="page-header">
    <p class="eyebrow">Study Slot · Account</p>
    <h1>내 정보</h1>
  </div>

  <section class="card">
    <div class="card-index">NO. 001</div>

    <div class="profile-row">
      <span class="avatar"
            th:text="${#strings.substring(loginUser.nickname, 0, 1)}">
        닉
      </span>

      <div class="profile-info">
        <h2 th:text="${loginUser.nickname}">닉네임</h2>
        <p class="email" th:text="${loginUser.email}">
          email@example.com
        </p>
      </div>
    </div>

    <div class="password-section">
      <div class="section-label">EDIT PROFILE</div>

      <div class="field">
        <label for="email">이메일</label>
        <input
                type="email"
                id="email"
                disabled
                th:value="${loginUser.email}">
      </div>

      <div class="field">
        <label for="nickname">닉네임</label>
        <input
                type="text"
                id="nickname"
                name="nickname"
                th:value="${loginUser.nickname}"
                placeholder="닉네임을 입력해주세요">
      </div>

      <div class="field">
        <label for="new-password">새 비밀번호</label>
        <input
                type="password"
                id="new-password"
                name="newPassword"
                placeholder="변경하지 않으려면 비워두세요">
      </div>

      <div class="field">
        <label for="new-password-confirm">새 비밀번호 확인</label>
        <input
                type="password"
                id="new-password-confirm"
                name="newPasswordConfirm"
                placeholder="새 비밀번호를 다시 입력해주세요">
      </div>
      <p id="edit-message" class="validation-message"></p>
    </div>

    <div class="button-section">
      <button type="button" id="edit-password-btn" class="btn btn-primary">
        회원정보 수정
      </button>

      <button type="button" class="btn btn-danger">
        회원탈퇴
      </button>
    </div>

  </section>

</div>

</body>
</html>
