<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>내 정보 - StudySlot</title>
  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/user/mypage.css}">
  <script th:src="@{/js/common/password-validation.js}"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const nicknameInput = document.getElementById("nickname");
      const passwordInput = document.getElementById("new-password");
      const passwordConfirmInput = document.getElementById("new-password-confirm");
      const passwordConfirmMsg = document.getElementById("password-confirm-msg");

      // 비밀번호 입력 시 실시간 조건 체크
      passwordInput.addEventListener("input", () => {
        checkPasswordRequirements(passwordInput.value);

        if (passwordConfirmInput.value) {
          checkPasswordMatch(passwordInput, passwordConfirmInput, passwordConfirmMsg);
        }
      });

      // 비밀번호 확인 입력 시 실시간 일치 체크
      passwordConfirmInput.addEventListener("input", () => {
        checkPasswordMatch(passwordInput, passwordConfirmInput, passwordConfirmMsg);
      });


      // 회원정보 수정
      document.getElementById("edit-password-btn").addEventListener("click", async () => {

        const nickname = nicknameInput.value.trim();
        const newPassword = passwordInput.value;
        const newPasswordConfirm = passwordConfirmInput.value;
        const messageEl = document.getElementById("edit-message");

        if (!nickname) {
          messageEl.textContent = "닉네임을 입력해주세요.";
          messageEl.style.color = "#A3402F";
          return;
        }

        // 비밀번호를 입력한 경우에만 검증
        if (newPassword || newPasswordConfirm) {
          const requirementsOk = checkPasswordRequirements(newPassword);
          if (!requirementsOk) {
            messageEl.textContent = "비밀번호는 영문과 숫자를 포함한 8~20자로 입력해주세요.";
            messageEl.style.color = "#A3402F";
            return;
          }

          const matchOk = checkPasswordMatch(passwordInput, passwordConfirmInput, passwordConfirmMsg);
          if (!matchOk) {
            messageEl.textContent = "비밀번호가 일치하지 않습니다.";
            messageEl.style.color = "#A3402F";
            return;
          }
        }

        try {
          const response = await fetch("/user/edit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nickname, newPassword, newPasswordConfirm }),
          });

          const data = await response.json();

          if (!response.ok) {
            messageEl.textContent = data.message;
            messageEl.style.color = "#A3402F";
            return;
          }

          alert(data.message);
          messageEl.textContent = "";
          passwordInput.value = "";
          passwordConfirmInput.value = "";
          passwordConfirmMsg.textContent = "";

          document.querySelector(".profile-info h2").textContent = data.nickname;
          document.querySelector(".avatar").textContent = data.nickname.charAt(0);

          const headerNickname = document.getElementById("header-nickname");
          if (headerNickname) {
            headerNickname.textContent = data.nickname + "님";
          }
        } catch (err) {
          messageEl.textContent = "요청 중 오류가 발생했습니다.";
          messageEl.style.color = "#A3402F";
        }
      });

      document.getElementById("withdraw-btn").addEventListener("click", async () => {
        const confirmed = confirm("정말 탈퇴하시겠습니까? 이 작업은 되돌릴 수 없습니다.");
        if (!confirmed) return;

        try {
          const response = await fetch("/user/withdraw", { method: "POST" });
          const data = await response.json();

          if (!response.ok) {
            alert(data.message);
            return;
          }

          alert(data.message);
          location.href = "/space/list";

        } catch (err) {
          alert("요청 중 오류가 발생했습니다.");
        }
      });

    });
  </script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="mypage-wrap">

  <div class="page-header">
    <p class="eyebrow">Study Slot · Account</p>
    <h1>내 정보</h1>
  </div>

  <section class="card">
    <div class="card-index">NO. 001</div>

    <div class="profile-row">
      <span class="avatar"
            th:text="${#strings.substring(loginUser.nickname, 0, 1)}">
        닉
      </span>

      <div class="profile-info">
        <h2 th:text="${loginUser.nickname}">닉네임</h2>
        <p class="email" th:text="${loginUser.email}">
          email@example.com
        </p>
      </div>
    </div>

    <div class="password-section">
      <div class="section-label">EDIT PROFILE</div>

      <div class="field">
        <label for="email">이메일</label>
        <input
                type="email"
                id="email"
                disabled
                th:value="${loginUser.email}">
      </div>

      <div class="field">
        <label for="nickname">닉네임</label>
        <input
                type="text"
                id="nickname"
                name="nickname"
                th:value="${loginUser.nickname}"
                placeholder="닉네임을 입력해주세요">
      </div>

      <div class="field">
        <label for="new-password">새 비밀번호</label>
        <input
                type="password"
                id="new-password"
                name="newPassword"
                placeholder="변경하지 않으려면 비워두세요">
        <ul class="password-requirements">
          <li id="req-length">8~20자</li>
          <li id="req-letter">영문 포함</li>
          <li id="req-number">숫자 포함</li>
        </ul>
      </div>

      <div class="field">
        <label for="new-password-confirm">새 비밀번호 확인</label>
        <input
                type="password"
                id="new-password-confirm"
                name="newPasswordConfirm"
                placeholder="새 비밀번호를 다시 입력해주세요">
        <p id="password-confirm-msg" class="validation-message"></p>
      </div>
    </div>
    <div class="button-section">
      <button type="button" id="edit-password-btn" class="btn btn-primary">
        회원정보 수정
      </button>

      <button type="button" id="withdraw-btn" class="btn btn-danger">
        회원탈퇴
      </button>
    </div>

  </section>

</div>

</body>
</html>
